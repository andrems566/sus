<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hábitos Diários da Pele</title>
    <style>
        :root {
            --bg-base: #f8f9fa;
            --primary: #6c5ce7;
            --text: #2d3436;
            --progress-bg: #e0e0e0;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            transition: all 0.5s ease; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background-color: var(--bg-base);
        }

        body.modal-open #BoxGeral {
            opacity: 0.3;
            filter: brightness(0.5) blur(2px);
            pointer-events: none;
        }

        #BoxGeral {
            position: relative; 
            background: white;
            padding: 80px 40px 40px 40px; 
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.1);
            width: 90%; max-width: 500px;
            min-height: 450px; text-align: center;
            z-index: 1;
        }

        #btnAjuda {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.4);
            z-index: 100;
            transition: 0.3s;
        }

        #btnAjuda:hover { transform: scale(1.1); }

        #modalAjuda {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            z-index: 101;
            width: 80%; max-width: 400px;
            text-align: center;
        }

        .fechar-modal {
            margin-top: 20px;
            background: var(--primary);
            color: white; border: none; padding: 10px 20px;
            border-radius: 10px; cursor: pointer;
        }

        .progress-container {
            width: 100%; height: 10px; background: var(--progress-bg);
            border-radius: 10px; margin-bottom: 30px; overflow: hidden; display: none;
        }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: 0.4s; }

        .voltar {
            all: unset; position: absolute; top: 25px; left: 25px;
            width: 45px; height: 45px; border-radius: 50%;
            background: white; border: 2px solid var(--primary);
            color: var(--primary); cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 22px; z-index: 99;
        }

        .step, .BoxInicial { width: 100%; display: none; }
        .active { display: block; }
        .option { display: flex; align-items: center; background: #f8f9fa; padding: 18px; margin: 12px 0; border-radius: 15px; cursor: pointer; border: 1px solid transparent; }
        .option:hover { border-color: var(--primary); }
        .option input { margin-right: 15px; transform: scale(1.2); }
        button:not(.voltar):not(.fechar-modal) { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        
        .btn-resultado { background: #38a169 !important; margin-top: 10px !important; }
    </style>
</head>
<body>

    <button id="btnAjuda" onclick="toggleModal(true)">?</button>

    <div id="modalAjuda">
        <h3 id="ajuda-titulo">Dica do Especialista</h3>
        <p id="ajuda-texto"></p>
        <button class="fechar-modal" onclick="toggleModal(false)">Entendi!</button>
    </div>

    <div id="BoxGeral">
        <div class="progress-container" id="barra-container">
            <div class="progress-bar" id="progresso"></div>
        </div>

        <div class="BoxInicial active" id="step-0">
            <h1>🧼 Hábitos Diários</h1>
            <p>Descubra como sua rotina afeta sua pele e receba uma recomendação personalizada.</p>
            <button onclick="nextStep()">Iniciar Questionário</button>
        </div>

        <div id="BoxQuest"></div>

        <div class="step" id="step-final">
            <h2>Análise Concluída</h2>
            <div id="resultado-texto" style="text-align: left; background: #f0fff4; padding: 20px; border-radius: 15px; border-left: 6px solid #38a169; margin-bottom: 20px;"></div>
            <button class="btn-resultado" onclick="verRecomendacao()">Ver Kit Recomendado ★</button>
            <button onclick="location.reload()" style="background: #999;">Refazer Diagnóstico</button>
        </div>
    </div>

<script>
    const questionario = [
        { q: "1. Quantos copos de água você bebe por dia?", options: ["Menos de 3", "3 a 5", "6 a 8", "Mais de 8"], ajuda: "A água hidrata a pele de dentro para fora, mantendo a elasticidade e o brilho natural." },
        { q: "2. Qual sua maior preocupação de beleza hoje?", options: ["Rugas e Linhas", "Sensibilidade/Vermelhidão", "Pele Seca/Opaca"], ajuda: "Isso nos ajuda a definir qual kit de ativos é o mais urgente para você agora." },
        { q: "3. Usa protetor solar diariamente?", options: ["Sempre", "Às vezes", "Raramente", "Nunca"], ajuda: "O sol é o maior causador de envelhecimento precoce e manchas." },
        { q: "4. Você dorme quantas horas por noite?", options: ["Menos de 5", "5 a 6", "7 a 8", "Mais de 8"], ajuda: "É durante o sono que as células da pele se renovam." },
        { q: "5. Com que frequência consome açúcar?", options: ["Diariamente", "Algumas vezes", "Raramente", "Nunca"], ajuda: "O excesso de açúcar quebra as fibras de colágeno da pele." },
        { q: "6. Como sua pele costuma reagir a novos produtos?", options: ["Fica vermelha/arde", "Fica oleosa", "Absorve rápido", "Normal"], ajuda: "Peles sensíveis precisam de fórmulas hipoalergênicas." },
        { q: "7. Sente sua pele repuxar após o banho?", options: ["Sempre", "Às vezes", "Raramente", "Nunca"], ajuda: "O repuxamento é um sinal claro de que a barreira de hidratação está comprometida." },
        { q: "8. Remove a maquiagem antes de dormir?", options: ["Sempre", "Às vezes", "Raramente", "Nunca"], ajuda: "Dormir de maquiagem impede a respiração da pele e causa cravos." },
        { q: "9. Sua alimentação é rica em frutas e legumes?", options: ["Sempre", "Às vezes", "Raramente", "Nunca"], ajuda: "Antioxidantes combatem os radicais livres que envelhecem a pele." },
        { q: "10. Qual a aparência dos seus poros?", options: ["Dilatados", "Quase invisíveis", "Sinto a pele descamando"], ajuda: "Isso ajuda a identificar o nível de hidratação ou necessidade de firmeza." }
    ];

    let CorrentePerguntas = 0;
    let answers = {};
    let tipoRecomendado = "Rugas e Linhas"; // Padrão

    const container = document.getElementById("BoxQuest");
    questionario.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "step";
        div.id = `step-${index + 1}`;
        div.innerHTML = `
            <button class="voltar" onclick="prevStep()">&larr;</button>
            <h2>${item.q}</h2>
            <div class="options-container">
                ${item.options.map(opt => `
                    <label class="option">
                        <input type="radio" name="q${index}" value="${opt}"> ${opt}
                    </label>
                `).join("")}
            </div>
            <button onclick="nextStep()">Próxima</button>
        `;
        container.appendChild(div);
    });

    function toggleModal(abrir) {
        const modal = document.getElementById("modalAjuda");
        if (abrir) {
            document.getElementById("ajuda-texto").innerText = questionario[CorrentePerguntas - 1].ajuda;
            modal.style.display = "block";
            document.body.classList.add("modal-open");
        } else {
            modal.style.display = "none";
            document.body.classList.remove("modal-open");
        }
    }

    function updateUI() {
        const btnAjuda = document.getElementById("btnAjuda");
        btnAjuda.style.display = (CorrentePerguntas > 0 && CorrentePerguntas <= questionario.length) ? "block" : "none";
        
        const bar = document.getElementById("progresso");
        const containerBar = document.getElementById("barra-container");
        if (CorrentePerguntas > 0 && CorrentePerguntas <= questionario.length) {
            containerBar.style.display = "block";
            bar.style.width = (CorrentePerguntas / questionario.length * 100) + "%";
        } else {
            containerBar.style.display = "none";
        }
    }

    function nextStep() {
        const currentDiv = document.getElementById(`step-${CorrentePerguntas}`);
        if (CorrentePerguntas > 0) {
            const selected = currentDiv.querySelector("input:checked");
            if (!selected) return alert("Por favor, selecione uma opção!");
            answers[`q${CorrentePerguntas - 1}`] = selected.value;
            
            // Lógica simples para pegar a recomendação da Pergunta 2
            if (CorrentePerguntas === 2) tipoRecomendado = selected.value;
        }
        currentDiv.classList.remove("active");
        CorrentePerguntas++;
        if (CorrentePerguntas <= questionario.length) {
            document.getElementById(`step-${CorrentePerguntas}`).classList.add("active");
            updateUI();
        } else {
            showResult();
        }
    }

    function prevStep() {
        document.getElementById(`step-${CorrentePerguntas}`).classList.remove("active");
        CorrentePerguntas--;
        document.getElementById(`step-${CorrentePerguntas}`).classList.add("active");
        updateUI();
    }

    function showResult() {
        updateUI();
        document.getElementById("step-final").classList.add("active");
        let score = 0;
        const boasRespostas = ["Sempre", "Mais de 8", "6 a 8", "7 a 8", "Não", "Nunca", "2 vezes", "Normal", "Quase invisíveis"];
        Object.values(answers).forEach(a => { if (boasRespostas.includes(a)) score++; });
        
        document.getElementById("resultado-texto").innerHTML = `
            <p><strong>Sua Pontuação de Saúde: ${score}/10</strong></p>
            <p>${score >= 7 ? "✨ Seus hábitos são ótimos!" : "⚠️ Sua rotina precisa de ajustes para proteger sua pele."}</p>
            <hr>
            <p>Com base nas suas respostas, o cuidado mais indicado para você agora é para: <strong>${tipoRecomendado}</strong>.</p>
        `;
    }

    function verRecomendacao() {    
        window.location.href = `Produtos.html?recomendacao=${encodeURIComponent(tipoRecomendado)}`;
    }
</script>
</body>
</html>
