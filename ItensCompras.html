<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto</title>
<link rel="stylesheet" href="Css/ItensCompras.css">
</head>
<body>

<div class="produto">

    <div class="imagem">
        <img id="imagemProduto" src="" alt="Produto">
    </div>

    <div class="info">
        <h1 id="nomeProduto"></h1>
        <p style="color: #777;">Vendido e entregue por Renova</p>

        <div class="avaliacoes">
            ★★★★★ <span class="numAvaliacoes">(45 avaliações)</span>
        </div>

        <p id="precoProduto" class="preco"></p>

        <div class="quantidade">
            <button onclick="diminuirQtd()">-</button>
            <span id="qtd">1</span>
            <button onclick="aumentarQtd()">+</button>
        </div>

        <div class="botoes">
            <button class="comprar" onclick="comprarProduto()">Comprar</button>
            <button class="favorito">❤</button>
        </div>

        <div class="descricao">
            <p id="descricaoProduto" class="textoDescricao"></p>
            <span class="lerMais" onclick="toggleDescricao()">Ler mais</span>
        </div>
    </div>

</div>

<!-- RELACIONADOS -->
<div class="relacionados">
    <h2>Produtos relacionados</h2>
    <div class="cardsRelacionados" id="relacionados"></div>
</div>

<script>
// PEGAR ID DA URL
let parametros = new URLSearchParams(window.location.search);
let produto = parametros.get("produto");

// PRODUTOS
let produtos = {
    1: { imagem: "Imagens/VidrosProdutos.jpeg", nome: "Kit Rejuvenecedor", preco: "R$ 120,00", descricao: "Loção Hidratante com 11% de mix de emolientes, 5% de glicerina, 1% de manteiga de abacate e 1% de pantenol para hidratar, aumentar o viço, melhorar a textura e acalmar a pele" },
    2: { imagem: "Imagens/ComunsProdutos.jpeg", nome: "Kit Aura Renovada", preco: "R$ 120,00", descricao: "Desenvolvido para peles oleosas e sensíveis, este produto ajuda a controlar a oleosidade enquanto acalma e hidrata a pele." },
    3: { imagem: "Imagens/Marrom.jpeg", nome: "Kit Renova", preco: "R$ 129,90", descricao: "Hidrata profundamente e deixa a pele com uma perfumação sofisticada e duradoura." },
    4: { imagem: "Imagens/ItensRenova/ItemRenova4.jpeg", nome: "Máscara Renova", preco: "R$ 21,80", descricao: "Proporciona hidratação profunda e brilho intenso." },
    5: { imagem: "Imagens/Ciano.jpeg", nome: "Kit Pele Seca", preco: "R$ 78,90", descricao: "Ideal para peles ressecadas com hidratação profunda e duradoura." },
    6: { imagem: "Imagens/ItensRenova/ItemRenova1.jpeg", nome: "Creme Renova", preco: "R$ 21,80", descricao: "Hidratação profunda e renovação da pele." },
    8: { imagem: "Imagens/Rosa.jpeg", nome: "Kit Renova Facial", preco: "R$ 99,99", descricao: "Cuidado completo para o rosto." },
    9: { imagem: "Imagens/ItensRenova/ItemRenova9.jpeg", nome: "Creme Renova", preco: "R$ 21,80", descricao: "Maciez e hidratação." },
    10:{ imagem: "Imagens/ItensRenova/ItemRenova8.jpeg", nome: "Óleo Renova", preco: "R$ 33,90", descricao: "Nutrição profunda." },
    11:{ imagem: "Imagens/ItensRenova/ItemRenova0.jpeg", nome: "Leave-in Renova", preco: "R$ 21,80", descricao: "Controle de frizz." },
    12:{ imagem: "Imagens/ItensRenova/ItemRenova2.jpeg", nome: "Esfoliante Renova", preco: "R$ 21,80", descricao: "Renovação da pele." }
};

let p = produtos[produto];

if (p) {
    document.getElementById("imagemProduto").src = p.imagem;
    document.getElementById("nomeProduto").innerText = p.nome;
    document.getElementById("precoProduto").innerText = p.preco;
    document.getElementById("descricaoProduto").innerText = p.descricao;
}

// QUANTIDADE
let quantidade = 1;

function aumentarQtd() {
    quantidade++;
    document.getElementById("qtd").innerText = quantidade;
}

function diminuirQtd() {
    if (quantidade > 1) {
        quantidade--;
        document.getElementById("qtd").innerText = quantidade;
    }
}

// LER MAIS
function toggleDescricao() {
    const texto = document.getElementById("descricaoProduto");
    const botao = document.querySelector(".lerMais");

    texto.classList.toggle("expandido");
    botao.innerText = texto.classList.contains("expandido") ? "Ler menos" : "Ler mais";
}

window.addEventListener("load", function() {
    const texto = document.getElementById("descricaoProduto");
    const botao = document.querySelector(".lerMais");

    setTimeout(() => {
        if (texto.scrollHeight <= texto.clientHeight) {
            botao.style.display = "none";
        }
    }, 100);
});

// PRODUTOS RELACIONADOS
let relacionadosDiv = document.getElementById("relacionados");
let count = 0;

for (let id in produtos) {
    if (id != produto && count < 4) {
        let item = produtos[id];

        relacionadosDiv.innerHTML += `
            <div class="cardRelacionado" onclick="window.location.href='ItensCompras.html?produto=${id}'">
                <img src="${item.imagem}">
                <p>${item.nome}</p>
                <strong>${item.preco}</strong>
            </div>
        `;
        count++;
    }
}

// COMPRAR
function comprarProduto() {
    let dadosCompra = {
        nome: document.getElementById("nomeProduto").innerText,
        preco: document.getElementById("precoProduto").innerText,
        imagem: document.getElementById("imagemProduto").src,
        quantidade: document.getElementById("qtd").innerText
    };

    localStorage.setItem("compra", JSON.stringify(dadosCompra));
    window.location.href = "checkout.html";
}
</script>

</body>
</html>
