<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Pele e Rotina</title>
    <style>
        :root {
            --bg-base: #f8f9fa;
            --primary: #6c5ce7;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-base);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.6s ease;
        }

        #quiz-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.4s ease-out; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h2 { margin-bottom: 25px; font-size: 1.4rem; }

        .options-container { text-align: left; margin-bottom: 20px; }

        .option {
            display: block;
            background: #f1f2f6;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .option:hover { background: #e0e0e0; }
        .option input { margin-right: 15px; }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .result-box {
            text-align: left;
            padding: 20px;
            background: #f0fff4;
            border-radius: 10px;
            border-left: 5px solid #38a169;
        }
    </style>
</head>
<body>

<div id="quiz-card">
    <div class="step active" id="step-0">
        <h1>🧴 Skin Analysis</h1>
        <p>Preencha seus dados para começar a consultoria.</p>
        <input type="text" id="nome" placeholder="Seu nome completo">
        <input type="email" id="email" placeholder="Seu melhor e-mail">
        <button onclick="nextStep()">Iniciar Questionário</button>
    </div>

    <div id="questions-container"></div>

    <div class="step" id="step-final">
        <h2>Seu Resultado Final</h2>
        <div id="resultado-texto" class="result-box"></div>
        <button onclick="location.reload()" style="margin-top:20px; background:#636e72">Refazer Teste</button>
    </div>
</div>

<script>
    const questions = [
        // Questionário 1 - Pele
        { q: "1. Como você define seu tipo de pele?", options: ["Oleosa", "Seca", "Mista", "Normal", "Não sei"], cat: "pele" },
        { q: "2. Sua pele costuma apresentar sensibilidade?", options: ["Sim, com frequência", "Às vezes", "Raramente", "Não"], cat: "sens" },
        { q: "4. Com que frequência sua pele fica oleosa ao longo do dia?", options: ["Nunca", "Pouco", "Moderadamente", "Muito"], cat: "oleo" },
        { q: "5. Sua pele costuma descamar ou repuxar?", options: ["Sim", "Não", "Às vezes"], cat: "seca" },
        // Questionário 2 - Rotina
        { q: "1. Como é sua rotina diária?", options: ["Corrida", "Moderada", "Tranquila"], cat: "rotina" },
        { q: "4. Você usa protetor solar no dia a dia?", options: ["Todos os dias", "Às vezes", "Raramente", "Nunca"], cat: "prot" }
    ];

    let currentStep = 0;
    let answers = {};

    // Gerar perguntas dinamicamente
    const container = document.getElementById('questions-container');
    questions.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'step';
        div.id = `step-${index + 1}`;
        div.innerHTML = `
            <h2>${item.q}</h2>
            <div class="options-container">
                ${item.options.map(opt => `
                    <label class="option">
                        <input type="radio" name="q${index}" value="${opt}"> ${opt}
                    </label>
                `).join('')}
            </div>
            <button onclick="nextStep()">Próxima Pergunta</button>
        `;
        container.appendChild(div);
    });

    function nextStep() {
        const currentDiv = document.getElementById(`step-${currentStep}`);
        
        // Validação da tela inicial
        if(currentStep === 0) {
            if(!document.getElementById('nome').value) return alert("Digite seu nome");
        }

        // Validação de resposta marcada
        if(currentStep > 0 && currentStep <= questions.length) {
            const radio = currentDiv.querySelector('input:checked');
            if(!radio) return alert("Selecione uma opção");
            answers[`q${currentStep-1}`] = radio.value;
        }

        currentDiv.classList.remove('active');
        currentStep++;

        if(currentStep <= questions.length) {
            const nextDiv = document.getElementById(`step-${currentStep}`);
            nextDiv.classList.add('active');
            updateBackground();
        } else {
            showResult();
        }
    }

    function updateBackground() {
        const colors = ['#f8f9fa', '#e9ecef', '#dee2e6', '#ced4da', '#adb5bd', '#6c757d', '#495057'];
        const colorIdx = Math.min(currentStep, colors.length - 1);
        document.body.style.backgroundColor = colors[colorIdx];
    }

    function showResult() {
        document.getElementById('step-final').classList.add('active');
        const resDiv = document.getElementById('resultado-texto');
        
        // Lógica de Interpretação Simplificada
        let tipoPele = "Mista";
        if(answers.q0 === "Oleosa" || answers.q2 === "Muito") tipoPele = "Oleosa";
        if(answers.q0 === "Seca" || answers.q3 === "Sim") tipoPele = "Seca";

        let perfil = "Intermediário";
        if(answers.q4 === "Corrida" && answers.q5 === "Nunca") perfil = "Desregulado ⚠️";
        if(answers.q4 === "Tranquila") perfil = "Equilibrado 🌿";

        resDiv.innerHTML = `
            <p><strong>Nome:</strong> ${document.getElementById('nome').value}</p>
            <p><strong>Tipo de Pele:</strong> ${tipoPele}</p>
            <p><strong>Perfil de Cotidiano:</strong> ${perfil}</p>
            <hr>
            <p><strong>Indicação:</strong> Use produtos leves pela manhã e foque na hidratação noturna.</p>
        `;
    }
</script>

</body>
</html>
