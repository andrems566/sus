<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Produtos</title>
    <style>
        :root { --bg: #f8f9fa; --text: #2d3436; --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; width: 100%; max-width: 1200px; }

        /* Card com expansão no Mouse Over */
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: var(--transition); cursor: pointer; height: 350px; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); height: 450px; }

        .img-box { height: 250px; background: #eee; display: flex; align-items: center; justify-content: center; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 20px; text-align: center; }
        .desc-hidden { max-height: 0; opacity: 0; transition: var(--transition); font-size: 0.9rem; color: #666; margin-top: 15px; }
        .card:hover .desc-hidden { max-height: 100px; opacity: 1; }

        /* Janela de Produto Único (Modal) */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 90%; max-width: 800px; height: 70vh; border-radius: 30px; display: flex; overflow: hidden; position: relative; animation: pop 0.3s ease-out; }
        .modal-left { flex: 1; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .modal-right { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .close { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; border: none; background: none; }
        
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @media (max-width: 700px) { .modal-content { flex-direction: column; } }
    </style>
</head>
<body>

    <h1>Vitrine Renova Facial</h1>
    <div class="grid-produtos" id="grid"></div>

    <div id="modal">
        <div class="modal-content">
            <button class="close" onclick="fechar()">&times;</button>
            <div class="modal-left" id="m-cor">
                <img id="m-img" src="Ciano.jpeg" style="width: 70%;">
            </div>
            <div class="modal-right">
                <h2 id="m-nome"></h2>
                <p id="m-texto" style="line-height: 1.6; color: #444;"></p>
                <button id="m-btn" style="padding: 15px; border: none; border-radius: 10px; color: white; cursor: pointer; font-weight: bold;">Comprar Agora</button>
            </div>
        </div>
    </div>

    <script>
        const produtos = [
            { id: 1, nome: "Kit Anti-Idade", cor: "#8e5d3e", foco: "Rugas e Linhas", texto: "Focado em colágeno e firmeza para peles maduras.", img: "Marrom.jpeg" },
            
            { id: 2, nome: "Kit Pele Sensível", cor: "#eeb7b7", foco: "Sensibilidade/Vermelhidão", texto: "Acalma e restaura a barreira cutânea com suavidade.", img: "Rosa.jpeg" },
            
            { id: 3, nome: "Kit Pele Seca", cor: "#a2d2df", foco: "Pele Seca/Opaca", texto: "Hidratação profunda para peles que repuxam.", img: "Ciano.jpeg" }
        ];

        // Lógica de recomendação: Pega o parâmetro da URL
        const params = new URLSearchParams(window.location.search);
        const rec = params.get('recomendacao');

        const grid = document.getElementById('grid');
        // Ordena para colocar o recomendado no topo
        const ordenados = [...produtos].sort((a,b) => a.foco === rec ? -1 : 1);

        ordenados.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="abrir(${p.id})">
                    <div class="img-box"><img src="${p.img}"></div>
                    <div class="info">
                        <h3 style="color:${p.cor}">${p.nome}</h3>
                        ${p.foco === rec ? '<span style="color:gold">★ Recomendado para você</span>' : ''}
                        <div class="desc-hidden">Toque para ver detalhes e comprar este kit exclusivo.</div>
                    </div>
                </div>
            `;
        });

        function abrir(id) {
            const p = produtos.find(x => x.id === id);
            document.getElementById('m-nome').innerText = p.nome;
            document.getElementById('m-nome').style.color = p.cor;
            document.getElementById('m-texto').innerText = p.texto;
            document.getElementById('m-img').src = p.img;
            document.getElementById('m-cor').style.backgroundColor = p.cor; // Cor do fundo do modal igual ao produto
            document.getElementById('m-btn').style.backgroundColor = p.cor;
            document.getElementById('modal').style.display = 'flex';
        }

        function fechar() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
