<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Produtos</title>
    <link rel="stylesheet" href="Css/Produtos.css">
</head>
<body>
    <button id="btnCompraFixo" onclick="irParaCompras()">
    🛒 Comprar
    </button>
    <h1>Vitrine Renova Facial</h1>
    <div class="grid-produtos" id="grid"></div>

    <div id="modal">
        <div class="modal-content">
            <button class="close" onclick="fechar()">&times;</button>
            <div class="modal-left" id="m-cor">
                <img id="m-img" src="Imagens/Ciano.jpeg" style="width: 70%;">
            </div>
            <div class="modal-right">
                <h2 id="m-nome"></h2>
                <p id="m-texto" style="line-height: 1.6; color: #444;"></p>
                <button id="m-btn" style="padding: 15px; border: none; border-radius: 10px; color:
                 white; cursor: pointer; font-weight: bold;">Comprar Agora</button>
            </div>
        </div>
    </div>

    <script>
        const produtos = [
            { id: 1, nome: "Kit Anti-Idade", cor: "#8e5d3e", foco: "Rugas e Linhas", texto: "Focado em colágeno e firmeza para peles maduras.", img: "Imagens/Marrom.jpeg" },
            
            { id: 2, nome: "Kit Pele Sensível", cor: "#eeb7b7", foco: "Sensibilidade/Vermelhidão", texto: "Acalma e restaura a barreira cutânea com suavidade.", img: "Imagens/Rosa.jpeg" },
            
            { id: 3, nome: "Kit Pele Seca", cor: "#a2d2df", foco: "Pele Seca/Opaca", texto: "Hidratação profunda para peles que repuxam.", img: "Imagens/Ciano.jpeg" }
        ];
        function irParaCompras(){
        window.location.href = "compras.html";
    }
        // Lógica de recomendação: Pega o parâmetro da URL
        const params = new URLSearchParams(window.location.search);
        const rec = params.get('recomendacao');

        const grid = document.getElementById('grid');
        // Ordena para colocar o recomendado no topo
        const ordenados = [...produtos].sort((a,b) => a.foco === rec ? -1 : 1);

        ordenados.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="abrir(${p.id})">
                    <div class="img-box"><img src="${p.img}"></div>
                    <div class="info">
                        <h3 style="color:${p.cor}">${p.nome}</h3>
                        ${p.foco === rec ? '<span style="color:gold">★ Recomendado para você</span>' : ''}
                        <div class="desc-hidden">Toque para ver detalhes e comprar este kit exclusivo.</div>
                    </div>
                </div>
            `;
        });

        function abrir(id) {
            const p = produtos.find(x => x.id === id);
            document.getElementById('m-nome').innerText = p.nome;
            document.getElementById('m-nome').style.color = p.cor;
            document.getElementById('m-texto').innerText = p.texto;
            document.getElementById('m-img').src = p.img;
            document.getElementById('m-cor').style.backgroundColor = p.cor; // Cor do fundo do modal igual ao produto
            document.getElementById('m-btn').style.backgroundColor = p.cor;
            document.getElementById('modal').style.display = 'flex';
        }

        function fechar() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
